name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,xls]"

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: bandit -r src
      - run: pytest --cov=excel_host_lookup --cov-report=term-missing --cov-fail-under=90
