[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xlswhisper"
version = "2.2.0"
description = "Robust multi-sheet XLSX host/IP lookup utility"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
xlslookup = "xlswhisper.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
